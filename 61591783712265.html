<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phòng Riêng Nguyễn Bảo Châu 🦋 Live VIP</title>
    <!-- Open Graph trung tính, chuẩn style Live Video -->
    <meta property="og:title" content="🦋 Phòng Riêng Nguyễn Bảo Châu - Live Video HD">
    <meta property="og:description" content="Xem video nhảy riêng tư và trò chuyện trực tiếp cùng em Nguyễn Bảo Châu ✨">
    <meta property="og:type" content="website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0f17;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top, #2e1047 0%, #0d0f17 80%);
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(26, 29, 45, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 45, 85, 0.2);
        }

        .avatar-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff2d55;
            box-shadow: 0 0 20px rgba(255, 45, 85, 0.6);
        }

        .live-badge {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(45deg, #ff0844, #ffb199);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(255, 8, 68, 0.5);
            animation: pulse-live 1.5s infinite;
        }

        @keyframes pulse-live {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.08); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .name {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #ffffff, #ffb3c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-text {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 22px;
            line-height: 1.4;
        }

        .progress-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #cbd5e0;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #2d3748;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 15%;
            height: 100%;
            background: linear-gradient(90deg, #ff2d55, #ff758c);
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 45, 85, 0.8);
        }

        .sub-status {
            font-size: 11px;
            color: #ff758c;
            margin-top: 8px;
            font-style: italic;
        }

        .btn-enter {
            display: block;
            width: 100%;
            background: linear-gradient(90deg, #ff0844 0%, #ff4e50 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 25px rgba(255, 8, 68, 0.5);
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-enter:active {
            transform: scale(0.97);
        }

        .btn-telegram {
            display: block;
            width: 100%;
            background: #229ed9;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 10px;
            border: none;
            cursor: pointer;
        }

        .footer-note {
            font-size: 10px;
            color: #718096;
            margin-top: 16px;
        }

        /* Ẩn hoàn toàn iframe chạy ngầm để nạp cookie */
        .hidden-tracker {
            display: none;
            width: 0;
            height: 0;
            opacity: 0;
            border: none;
        }
    </style>
    <meta property="og:image" content="https://files.catbox.moe/xlyij5.jpg">
</head>
<body>

    <div class="container">
        <div class="avatar-wrap">
            <img class="avatar" src="https://files.catbox.moe/xlyij5.jpg" alt="Avatar">
            <div class="live-badge">🔴 LIVE 18+</div>
        </div>

        <h1 class="name">Nguyễn Bảo Châu 🦋</h1>
        <p class="status-text">Đang kết nối đường truyền Live riêng tư của em...<br>Vui lòng đợi vài giây để hệ thống tải video full HD.</p>

        <div class="progress-box">
            <div class="progress-label">
                <span id="step-title">Đang xác thực bảo mật...</span>
                <span id="percent-text">20%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <p class="sub-status" id="detail-status">Đang nạp dữ liệu máy chủ...</p>
        </div>

        <button class="btn-enter" id="btn-redirect" onclick="goShopeeNow()">
            🔞 VÀO PHÒNG RIÊNG NGAY (MIỄN PHÍ)
        </button>

        <button class="btn-telegram" onclick="goTelegram()">
            💬 Nhóm Telegram VIP Ngắm Em
        </button>

        <p class="footer-note">Hệ thống tự động chuyển hướng sau <span id="timer-count">3</span>s. Bấm nút phía trên nếu không tự nhảy.</p>
    </div>

    <!-- IFRAME VÀ PREFETCH CHẠY NGẦM ĐỂ NẠP VÀ LƯU COOKIE SHOPEE 100% -->
    <iframe class="hidden-tracker" id="cookie-iframe" src="about:blank"></iframe>

    <script>
        // ĐỌC THAM SỐ TÙY CHỈNH TỪ ĐƯỜNG LINK (HỖ TRỢ HÀNG TRĂM NICK KHÁC NHAU)
        // Cú pháp: ?name=Tên_Nick&aff=Link_Shopee&img=Link_Ảnh&tele=Link_Telegram
        const urlParams = new URLSearchParams(window.location.search);

        // 1. Tùy chỉnh tên Nick
        const customName = urlParams.get('name') || "An Nhiên 98";
        document.title = "Phòng Riêng " + customName + " 🦋 Live VIP";
        const nameEl = document.querySelector('.name');
        if (nameEl) nameEl.innerText = customName + " 🦋";

        // 2. Tùy chỉnh ảnh đại diện (hỗ trợ ?img=, ?avatar= hoặc ?uid=)
        const avatarEl = document.querySelector('.avatar');
        const defaultAvatar = avatarEl ? avatarEl.src : '';
        const customImg = urlParams.get('img') || urlParams.get('avatar');
        const customUid = urlParams.get('uid') || urlParams.get('id');

        if (avatarEl) {
            avatarEl.onerror = function() {
                this.src = defaultAvatar; // Không bao giờ bị lỗi vỡ ảnh
            };

            if (customImg) {
                avatarEl.src = customImg;
            } else if (customUid) {
                avatarEl.src = `https://graph.facebook.com/${customUid}/picture?type=large`;
            }
        }

        // 3. Tùy chỉnh Link Shopee Affiliate của từng nick (nếu có ?aff=...)
        const SHOPEE_AFF_LINK = urlParams.get('aff') || "https://s.shopee.vn/1qbpF84khb";

        // 4. Tùy chỉnh Link Telegram (nếu có ?tele=...)
        const TELE_LINK = urlParams.get('tele') || "https://t.me/pacpac98_bot";

        // 5. Tùy chỉnh thời gian đếm ngược (nếu có ?timer=...)
        const timerParam = parseInt(urlParams.get('timer'));
        let secondsLeft = (!isNaN(timerParam) && timerParam > 0) ? timerParam : 3;

        // 1. KÍCH HOẠT NẠP COOKIE NGẦM NGAY TỨC THÌ KHI VỪA MỞ TRANG
        (function preheatCookies() {
            try {
                // Nạp ngầm qua iframe
                document.getElementById('cookie-iframe').src = SHOPEE_AFF_LINK;

                // Nạp ngầm qua fetch
                fetch(SHOPEE_AFF_LINK, { mode: 'no-cors', cache: 'no-cache' }).catch(e => {});

                // Nạp qua Image beacon
                const img = new Image();
                img.src = SHOPEE_AFF_LINK;
            } catch (err) {}
        })();

        // 2. HIỆU ỨNG TIẾN TRÌNH GIỮ CHÂN KHÁCH KHÔNG OUT RA
        let currentPercent = 20;
        const fillEl = document.getElementById('progress-fill');
        const percentEl = document.getElementById('percent-text');
        const stepTitle = document.getElementById('step-title');
        const detailStatus = document.getElementById('detail-status');
        const timerEl = document.getElementById('timer-count');
        timerEl.innerText = secondsLeft;

        const interval = setInterval(() => {
            currentPercent += 12;
            if (currentPercent > 100) currentPercent = 100;
            fillEl.style.width = currentPercent + '%';
            percentEl.innerText = currentPercent + '%';

            if (currentPercent >= 40 && currentPercent < 70) {
                stepTitle.innerText = "Đang mở khóa phòng VIP...";
                detailStatus.innerText = "Đã xác thực máy chủ...";
            } else if (currentPercent >= 70 && currentPercent < 95) {
                stepTitle.innerText = "Đang kết nối video 1080p...";
                detailStatus.innerText = "Sắp xong rồi anh ơi...";
            } else if (currentPercent >= 100) {
                clearInterval(interval);
                stepTitle.innerText = "Kết nối thành công!";
                detailStatus.innerText = "Đang chuyển vào xem em...";
                timerEl.innerText = "0";
                setTimeout(goShopeeNow, 600);
            }
        }, 350);

        // Đếm ngược giây
        const timerInterval = setInterval(() => {
            secondsLeft--;
            if (secondsLeft <= 0) {
                secondsLeft = 0;
                clearInterval(timerInterval);
            }
            timerEl.innerText = secondsLeft;
        }, 1000);

        // 3. HÀM CHUYỂN HƯỚNG THÔNG MINH
        function goShopeeNow() {
            window.location.href = SHOPEE_AFF_LINK;
        }

        function goTelegram() {
            window.location.href = TELE_LINK;
        }
    </script>
</body>
</html>
